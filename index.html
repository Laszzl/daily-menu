<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>食堂菜库</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="menu-page">
    <header class="page-header">
      <h1>食堂菜库</h1>
      <button class="settings-button" id="open-settings" type="button" aria-controls="settings"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 8.75a3.25 3.25 0 1 0 0 6.5 3.25 3.25 0 0 0 0-6.5Z" stroke="currentColor" stroke-width="1.7"/><path d="M19.2 13.4a7.7 7.7 0 0 0 0-2.8l1.5-1.2-1.5-2.6-1.9.6a7.6 7.6 0 0 0-2.4-1.4L14.5 4h-3l-.4 2a7.6 7.6 0 0 0-2.4 1.4l-1.9-.6-1.5 2.6 1.5 1.2a7.7 7.7 0 0 0 0 2.8l-1.5 1.2 1.5 2.6 1.9-.6a7.6 7.6 0 0 0 2.4 1.4l.4 2h3l.4-2a7.6 7.6 0 0 0 2.4-1.4l1.9.6 1.5-2.6-1.5-1.2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>设置</span></button>
    </header>
    <nav class="categories" aria-label="菜品分类">
      <button class="category selected" data-filter="meat" aria-pressed="true">荤菜</button>
      <button class="category" data-filter="vegetable" aria-pressed="false">素菜</button>
      <button class="category" data-filter="soup" aria-pressed="false">汤</button>
    </nav>
    <p id="status" class="status" role="status">正在加载菜库…</p>
    <section class="grid" aria-label="菜品列表"></section>
    <section id="pending" hidden><h2>待确认分类</h2><p class="status">这些菜正在识别，或需要确认后才能归类。</p><div class="grid" id="pending-grid"></div></section>
  </main>
  <main id="settings" class="settings-page" aria-labelledby="settings-title" hidden>
    <div class="settings-head"><div><p class="eyebrow">食堂菜库 / 管理</p><h2 id="settings-title">设置</h2></div><button id="close-settings" class="close-settings" type="button">返回菜库</button></div>
    <div class="settings-content">
      <section class="settings-section admin-section" aria-labelledby="admin-title">
        <div class="section-heading"><div><h3 id="admin-title">管理员账户</h3></div><span id="admin-badge" class="badge neutral">已锁定</span></div>
        <p id="admin-message" class="hint" role="status">登录后管理菜品、配图与历史记录。</p>
        <form id="admin-login" class="admin-login">
          <label>管理员邮箱<input id="admin-email" type="email" autocomplete="username" required></label>
          <label>密码<input id="admin-password" type="password" autocomplete="current-password" required></label>
          <button class="check-button" type="submit">解锁设置</button>
        </form>
        <button id="admin-logout" class="check-button" type="button" hidden>锁定</button>
      </section>
      <div id="admin-protected" hidden>
      <nav class="settings-nav" aria-label="管理功能">
        <button type="button" class="settings-tab" data-panel="images" aria-pressed="true">配图等候</button>
        <button type="button" class="settings-tab" data-panel="history" aria-pressed="false">菜品与历史</button>
        <button type="button" class="settings-tab" data-panel="work" aria-pressed="false">待处理事项</button>
        <button type="button" class="settings-tab" data-panel="system" aria-pressed="false">系统状态</button>
      </nav>
      <div class="settings-panel" data-settings-panel="images">
      <section class="settings-section" aria-labelledby="image-requests-title">
        <div class="section-heading"><div><h3 id="image-requests-title">配图等候区</h3></div></div>
        <div id="admin-image-requests"></div>
      </section>
      </div><div class="settings-panel" data-settings-panel="history" hidden>
      <section class="settings-section" aria-labelledby="history-title">
        <div class="section-heading"><div><h3 id="history-title">菜品与历史</h3></div></div>
        <div id="admin-history"></div>
      </section>
      </div><div class="settings-panel" data-settings-panel="system" hidden>
      <section class="settings-section" aria-labelledby="connection-title">
        <div class="section-heading"><div><h3 id="connection-title">数据库连接</h3></div><span id="connection-badge" class="badge" role="status">检查中</span></div>
        <p id="connection-detail" class="detail">正在读取菜库…</p>
        <div class="section-footer"><button class="check-button" id="check-connection" type="button">重新检查</button></div>
        
      </section>
      </div><div class="settings-panel" data-settings-panel="work" hidden>
      <section class="settings-section" aria-labelledby="worklist-title">
        <div class="section-heading"><div><h3 id="worklist-title">需要处理</h3></div></div>
        <div id="admin-worklist" aria-live="polite"><p class="hint">正在读取待处理事项…</p></div>
      </section>
      </div><div class="settings-panel" data-settings-panel="system" hidden>
      <section class="settings-section" aria-labelledby="tasks-title">
        <div class="section-heading"><div><h3 id="tasks-title">后台任务</h3></div></div>
        <div id="admin-results" hidden></div>
        <div class="section-footer"><button id="admin-refresh" class="check-button" type="button" hidden>刷新任务状态</button></div>
      </section>
      <section class="settings-section" aria-labelledby="usage-title">
        <div class="section-heading"><div><h3 id="usage-title">用量与费用</h3></div></div>
        <div id="admin-usage" aria-live="polite"><p class="hint">正在读取…</p></div>
        <div class="section-footer"><button id="usage-refresh" class="check-button" type="button">刷新用量</button></div>
      </section>
      
      </div>
      </div>
    </div>
  </main>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
  <script src="worklist.js"></script>
  <script src="images-admin.js"></script>
  <script src="history.js"></script>
  <script src="admin.js"></script>
</body>
</html>
